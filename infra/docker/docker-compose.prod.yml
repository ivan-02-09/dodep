# Docker Compose — Production (single-VPS deployment)
# Usage: docker compose -f infra/docker/docker-compose.prod.yml --env-file .env.production up -d
version: "3.9"

x-go-service: &go-service-defaults
  restart: unless-stopped
  env_file: ../../.env.production
  networks:
    - backend
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

x-rust-service: &rust-service-defaults
  restart: unless-stopped
  env_file: ../../.env.production
  networks:
    - backend
  logging:
    driver: "json-file"
    options:
      max-size: "50m"
      max-file: "5"

services:
  # ================================================================
  # DATA LAYER
  # ================================================================

  postgres:
    # The migrations require the Citus, pg_partman and pg_stat_statements
    # extensions (libs/migrations/postgresql/001_extensions_and_enums.sql).
    # The vanilla postgres image cannot CREATE EXTENSION citus, so the first
    # initdb script aborted and the database was never provisioned.
    image: citusdata/citus:12.1
    container_name: opus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-opus_casino}
      POSTGRES_USER: ${POSTGRES_USER:-opus_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # Read by the initdb wrapper below.
      MIGRATIONS_DIR: /opt/opus-migrations
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # NOT mounted into /docker-entrypoint-initdb.d: that directory is run
      # verbatim, in C sort order, which executes 014_*.down.sql (DROP TABLE)
      # before 014_*.sql. The wrapper applies up-migrations only, with
      # ON_ERROR_STOP=1, and records them in schema_migrations.
      - ../../libs/migrations/postgresql:/opt/opus-migrations:ro
      # Executable on purpose: the entrypoint runs an *executable* .sh file,
      # while a non-executable one is sourced into its own shell (where our
      # `set -e` / `return` would leak into the entrypoint). The script keeps
      # everything in a subshell for the same reason.
      - ./postgres-migrate.sh:/docker-entrypoint-initdb.d/10-opus-migrate.sh:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opus_app} -d ${POSTGRES_DB:-opus_casino}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"

  dragonfly:
    image: docker.dragonflydb.io/dragonflydb/dragonfly:v1.13.0
    container_name: opus-dragonfly
    restart: unless-stopped
    ulimits:
      memlock: -1
    command: >
      --logtostderr
      --cache_mode=true
      --maxmemory=4gb
      --requirepass=${REDIS_PASSWORD}
      --hz=100
    volumes:
      - dragonfly_data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3-alpine
    container_name: opus-clickhouse
    restart: unless-stopped
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-opus_casino}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD}
    volumes:
      - clickhouse_data:/var/lib/clickhouse
      - ../../libs/migrations/clickhouse:/docker-entrypoint-initdb.d:ro
    networks:
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  redpanda:
    image: docker.redpanda.com/redpandadata/redpanda:v23.3.18
    container_name: opus-redpanda
    restart: unless-stopped
    command:
      - redpanda start
      - --smp 2
      - --memory 2G
      - --reserve-memory 0M
      - --overprovisioned
      - --node-id 0
      - --kafka-addr PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr PLAINTEXT://redpanda:29092,OUTSIDE://redpanda:9092
    volumes:
      - redpanda_data:/var/lib/redpanda/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  minio:
    image: minio/minio:RELEASE.2024-03-15T01-07-19Z
    container_name: opus-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio_data:/data
    networks:
      - backend
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ================================================================
  # OBSERVABILITY
  # ================================================================

  jaeger:
    image: jaegertracing/all-in-one:1.56
    container_name: opus-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
    networks:
      - backend
      - monitoring
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:16686/"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  prometheus:
    image: prom/prometheus:v2.51.2
    container_name: opus-prometheus
    restart: unless-stopped
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    networks:
      - monitoring
      - backend
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:9090/-/healthy"]
      interval: 15s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  grafana:
    image: grafana/grafana:10.4.2
    container_name: opus-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_SERVER_DOMAIN: ${GRAFANA_DOMAIN:-grafana.localhost}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - monitoring
    depends_on:
      - prometheus
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"

  # ================================================================
  # RUST SERVICES (critical path)
  # ================================================================

  wallet-core:
    <<: *rust-service-defaults
    container_name: opus-wallet-core
    image: opus-casino/wallet-core:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rust
      args:
        SERVICE_NAME: wallet-core
        PROFILE: release
    environment:
      # wallet-core is config-rs based: every key is <PREFIX>__<FIELD>.
      # DATABASE_URL / GRPC_PORT / HTTP_PORT were silently ignored, so the
      # process tried postgres@localhost and bound HTTP on 0.0.0.0:3003 while
      # nginx proxied wallet-core:8081.
      DATABASE__HOST: postgres
      DATABASE__PORT: 5432
      DATABASE__DATABASE: ${POSTGRES_DB:-opus_casino}
      DATABASE__USERNAME: ${POSTGRES_USER}
      DATABASE__PASSWORD: ${POSTGRES_PASSWORD}
      REDIS__HOST: ${REDIS_HOST:-dragonfly}
      REDIS__PORT: ${REDIS_PORT:-6379}
      REDIS__PASSWORD: ${REDIS_PASSWORD}
      GRPC__ADDR: 0.0.0.0:50053
      # Port nginx proxies as wallet_upstream and the healthcheck probes.
      HTTP__ADDR: 0.0.0.0:8081
      # Currency for wallets opened without an explicit Money.currency. It used
      # to be a hardcoded "USD" in the gRPC handlers.
      APP__DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      APP__ENV: ${APP_ENV:-production}
      TRACING__OTLP_ENDPOINT: http://jaeger:4317
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8081/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  betting-engine:
    <<: *rust-service-defaults
    container_name: opus-betting-engine
    image: opus-casino/betting-engine:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rust
      args:
        SERVICE_NAME: betting-engine
        PROFILE: release
    environment:
      # AppConfig::load() only reads Environment::with_prefix("APP") with the
      # "__" separator. DATABASE_URL was ignored, and app.database_url has no
      # serde default, so the service aborted at startup.
      APP__DATABASE_URL: ${DATABASE_URL}
      APP__CACHE_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}/0
      APP__REDPANDA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      APP__HTTP_PORT: 8080
      APP__GRPC_PORT: 50054
      APP__AUTH_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY}
      APP__SPORTRADAR_API_KEY: ${SPORTRADAR_API_KEY}
      APP__SPORTRADAR_LIVE_ODDS_WS: ${SPORTRADAR_LIVE_ODDS_WS}
      # Bets lock the stake in wallet-core and settlements move the money;
      # without this address the engine books bets nobody paid for.
      APP__WALLET_SERVICE_ADDR: http://wallet-core:50053
      APP__WALLET_ENABLED: "true"
      APP__DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      APP__ENV: ${APP_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RUST_LOG: info
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      wallet-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  websocket-gateway:
    <<: *rust-service-defaults
    container_name: opus-websocket-gateway
    image: opus-casino/websocket-gateway:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.rust
      args:
        SERVICE_NAME: websocket-gateway
        PROFILE: release
    environment:
      # Same APP__-only loader as betting-engine: redpanda_brokers and
      # cache_url have no serde defaults, so HTTP_PORT/KAFKA_BROKERS alone left
      # the gateway unable to start.
      APP__CACHE_URL: redis://:${REDIS_PASSWORD}@${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}/0
      APP__REDPANDA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      # Port nginx proxies as ws_upstream.
      APP__HTTP_PORT: 8082
      APP__MAX_CONNECTIONS: "100000"
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      RUST_LOG: info
    depends_on:
      betting-engine:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8082/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ================================================================
  # GO SERVICES (business logic)
  # ================================================================

  auth:
    <<: *go-service-defaults
    container_name: opus-auth
    image: opus-casino/auth:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/auth
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      PORT: 8083
      GRPC_PORT: 50051
      DATABASE_URL: ${DATABASE_URL}
      # The Go binaries read REDIS_ADDR/REDIS_PASSWORD (REDIS_URL was passed
      # and never parsed, so every service fell back to localhost).
      REDIS_ADDR: ${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_ED25519_PRIVATE_KEY: ${JWT_ED25519_PRIVATE_KEY}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY}
      JWT_ACCESS_EXPIRY: ${JWT_ACCESS_EXPIRY:-900}
      JWT_REFRESH_EXPIRY: ${JWT_REFRESH_EXPIRY:-604800}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      APP_BASE_URL: ${APP_BASE_URL}
      WEB_APP_URL: ${APP_BASE_URL}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI}
      # auth honours APP_ENV=development to skip its fail-fast JWT checks; in
      # production neither this nor the Ed25519 keys may be empty.
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8083/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  user:
    <<: *go-service-defaults
    container_name: opus-user
    image: opus-casino/user:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/user
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      PORT: 8085
      GRPC_PORT: 50052
      DATABASE_URL: ${DATABASE_URL}
      # The Go binaries read REDIS_ADDR/REDIS_PASSWORD (REDIS_URL was passed
      # and never parsed, so every service fell back to localhost).
      REDIS_ADDR: ${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      AUTH_GRPC_ADDR: auth:50051
      SUMSUB_API_KEY: ${SUMSUB_API_KEY}
      SUMSUB_APP_TOKEN: ${SUMSUB_APP_TOKEN}
      SUMSUB_SECRET_KEY: ${SUMSUB_SECRET_KEY}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY}
      GEO_BLOCKED_COUNTRIES: ${GEO_BLOCKED_COUNTRIES}
      # config.Validate() fails the process outside APP_ENV=development unless
      # one of these is usable; APP_ENV also decides whether it runs at all.
      APP_ENV: ${APP_ENV:-production}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      auth:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8085/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  payment:
    <<: *go-service-defaults
    container_name: opus-payment
    image: opus-casino/payment:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/payment
        CMD_PATH: cmd/server
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      PAYMENT_SERVER_PORT: 8084
      PAYMENT_DATABASE_HOST: postgres
      PAYMENT_DATABASE_PORT: 5432
      PAYMENT_DATABASE_USER: ${POSTGRES_USER}
      PAYMENT_DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
      PAYMENT_DATABASE_DATABASE: ${POSTGRES_DB}
      PAYMENT_DATABASE_SSL_MODE: ${POSTGRES_SSL_MODE:-disable}
      PAYMENT_REDIS_HOST: dragonfly
      PAYMENT_REDIS_PORT: 6379
      PAYMENT_REDIS_PASSWORD: ${REDIS_PASSWORD}
      PAYMENT_KAFKA_BROKERS: redpanda:9092
      PAYMENT_NOWPAYMENTS_BASE_URL: ${PAYMENT_NOWPAYMENTS_BASE_URL}
      PAYMENT_NOWPAYMENTS_API_KEY: ${PAYMENT_NOWPAYMENTS_API_KEY}
      PAYMENT_NOWPAYMENTS_IPN_SECRET: ${PAYMENT_NOWPAYMENTS_IPN_SECRET}
      PAYMENT_NOWPAYMENTS_IPN_CALLBACK_URL: ${PAYMENT_NOWPAYMENTS_IPN_CALLBACK_URL}
      PAYMENT_WALLET_ADDRESS: wallet-core:50053
      PAYMENT_USER_ADDRESS: user:50052
      PAYMENT_AUTH_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY}
      PAYMENT_TRACING_ENDPOINT: jaeger:4317
      PAYMENT_TRACING_ENABLED: "true"
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      wallet-core:
        condition: service_healthy
      user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8084/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  casino:
    <<: *go-service-defaults
    container_name: opus-casino
    image: opus-casino/casino:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/casino
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      PORT: 8086
      GRPC_PORT: 50057
      DATABASE_URL: ${DATABASE_URL}
      # The Go binaries read REDIS_ADDR/REDIS_PASSWORD (REDIS_URL was passed
      # and never parsed, so every service fell back to localhost).
      # casino is the one Go service that composes REDIS_HOST + ":" +
      # REDIS_PORT itself; REDIS_ADDR is ignored here.
      REDIS_HOST: ${REDIS_HOST:-dragonfly}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WALLET_GRPC_ADDR: wallet-core:50053
      USER_GRPC_ADDR: user:50052
      # Currency handed to the slot providers and asked of the wallet. Providers
      # take one code per session, so it cannot be derived per request; the
      # service hardcoded "USD" before this variable existed.
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-USD}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-redpanda:9092}
      PRAGMATIC_ENABLED: ${PRAGMATIC_ENABLED:-false}
      PRAGMATIC_AGENT_ID: ${PRAGMATIC_AGENT_ID}
      PRAGMATIC_SECRET_KEY: ${PRAGMATIC_SECRET_KEY}
      PRAGMATIC_API_URL: ${PRAGMATIC_API_URL}
      PGSOFT_ENABLED: ${PGSOFT_ENABLED:-false}
      PGSOFT_OPERATOR_TOKEN: ${PGSOFT_OPERATOR_TOKEN}
      PGSOFT_SECRET_KEY: ${PGSOFT_SECRET_KEY}
      PGSOFT_API_URL: ${PGSOFT_API_URL}
      AMATIC_ENABLED: ${AMATIC_ENABLED:-false}
      AMATIC_OPERATOR_ID: ${AMATIC_OPERATOR_ID}
      AMATIC_API_PASSWORD: ${AMATIC_API_PASSWORD}
      AMATIC_SECRET_KEY: ${AMATIC_SECRET_KEY}
      AMATIC_API_URL: ${AMATIC_API_URL}
      AMUSNET_ENABLED: ${AMUSNET_ENABLED:-false}
      AMUSNET_OPERATOR_ID: ${AMUSNET_OPERATOR_ID}
      AMUSNET_SECRET_KEY: ${AMUSNET_SECRET_KEY}
      AMUSNET_API_URL: ${AMUSNET_API_URL}
      GEO_BLOCKED_COUNTRIES: ${GEO_BLOCKED_COUNTRIES}
      APP_ENV: ${APP_ENV:-production}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Signature replay window for provider callbacks (default 180s).
      PRAGMATIC_REPLAY_WINDOW_SEC: ${PRAGMATIC_REPLAY_WINDOW_SEC:-180}
      PGSOFT_REPLAY_WINDOW_SEC: ${PGSOFT_REPLAY_WINDOW_SEC:-180}
      # mTLS material for Amusnet, mounted from the compose secrets below.
      AMUSNET_CLIENT_CERT_PATH: /run/secrets/amusnet_client.crt
      AMUSNET_CLIENT_KEY_PATH: /run/secrets/amusnet_client.key
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      dragonfly:
        condition: service_healthy
      wallet-core:
        condition: service_healthy
      user:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8086/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  bonus:
    <<: *go-service-defaults
    container_name: opus-bonus
    image: opus-casino/bonus:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/bonus
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      PORT: 8088
      GRPC_PORT: 50056
      DATABASE_URL: ${DATABASE_URL}
      # The Go binaries read REDIS_ADDR/REDIS_PASSWORD (REDIS_URL was passed
      # and never parsed, so every service fell back to localhost).
      REDIS_ADDR: ${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      WALLET_GRPC_ADDR: wallet-core:50053
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      WELCOME_BONUS_PERCENTAGE: ${WELCOME_BONUS_PERCENTAGE:-100}
      WELCOME_BONUS_MAX_AMOUNT: ${WELCOME_BONUS_MAX_AMOUNT:-200}
      WELCOME_BONUS_WAGERING_REQUIREMENT: ${WELCOME_BONUS_WAGERING_REQUIREMENT:-30}
      WELCOME_BONUS_EXPIRY_DAYS: ${WELCOME_BONUS_EXPIRY_DAYS:-30}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      OTEL_SERVICE_NAME: bonus
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      wallet-core:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8088/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  notification:
    <<: *go-service-defaults
    container_name: opus-notification
    image: opus-casino/notification:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/notification
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      PORT: 8087
      GRPC_PORT: 50058
      DATABASE_URL: ${DATABASE_URL}
      # The Go binaries read REDIS_ADDR/REDIS_PASSWORD (REDIS_URL was passed
      # and never parsed, so every service fell back to localhost).
      REDIS_ADDR: ${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # notification subscribes to REDPANDA_BROKERS; KAFKA_BROKERS was passed
      # and ignored, so the consumer silently pointed at localhost:9092.
      REDPANDA_BROKERS: ${REDPANDA_BROKERS:-redpanda:9092}
      REDPANDA_ENABLED: ${REDPANDA_ENABLED:-true}
      # The delivery channels are configured through EMAIL_*/SMS_*/PUSH_*; the
      # SMTP_* names below were never read by this service.
      EMAIL_ENABLED: ${EMAIL_ENABLED:-false}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-sendgrid}
      EMAIL_FROM: ${EMAIL_FROM}
      EMAIL_API_KEY: ${EMAIL_API_KEY}
      EMAIL_API_SECRET: ${EMAIL_API_SECRET}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SMS_PROVIDER: ${SMS_PROVIDER:-twilio}
      SMS_API_KEY: ${SMS_API_KEY}
      SMS_API_SECRET: ${SMS_API_SECRET}
      PUSH_ENABLED: ${PUSH_ENABLED:-false}
      PUSH_FIREBASE_KEY: ${PUSH_FIREBASE_KEY}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
      APP_BASE_URL: ${APP_BASE_URL}
      APP_ENV: ${APP_ENV:-production}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
      redpanda:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8087/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  kyc:
    <<: *go-service-defaults
    container_name: opus-kyc
    image: opus-casino/kyc:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/kyc
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      PORT: 8089
      GRPC_PORT: 50059
      DATABASE_URL: ${DATABASE_URL}
      # The Go binaries read REDIS_ADDR/REDIS_PASSWORD (REDIS_URL was passed
      # and never parsed, so every service fell back to localhost).
      REDIS_ADDR: ${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      SUMSUB_API_KEY: ${SUMSUB_API_KEY}
      SUMSUB_APP_TOKEN: ${SUMSUB_APP_TOKEN}
      SUMSUB_SECRET_KEY: ${SUMSUB_SECRET_KEY}
      SUMSUB_API_URL: ${SUMSUB_API_URL}
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8089/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  admin-bff:
    <<: *go-service-defaults
    container_name: opus-admin-bff
    image: opus-casino/admin-bff:${IMAGE_TAG:-latest}
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile.go
      args:
        SERVICE_PATH: services/go/admin-bff
        VERSION: ${IMAGE_TAG:-dev}
    environment:
      # internal/config reads HTTP_PORT (PORT was ignored -> the service bound
      # 8080 while nginx proxied 8091).
      HTTP_PORT: 8091
      DATABASE_URL: ${DATABASE_URL}
      # The Go binaries read REDIS_ADDR/REDIS_PASSWORD (REDIS_URL was passed
      # and never parsed, so every service fell back to localhost).
      REDIS_ADDR: ${REDIS_HOST:-dragonfly}:${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      # internal/config reads *_SERVICE_ADDR; the *_GRPC_ADDR names were
      # silently ignored and every client fell back to localhost.
      AUTH_SERVICE_ADDR: auth:50051
      USER_SERVICE_ADDR: user:50052
      PAYMENT_SERVICE_ADDR: payment:50055
      BETTING_ENGINE_ADDR: betting-engine:50054
      # The BFF both signs (login) and verifies admin tokens; the middleware
      # reads the base64 key pair, which is the same material auth uses, so an
      # admin token stays valid across services. JWT_SECRET_KEY is only the
      # dev-mode HMAC fallback and must not be the sole configured key.
      JWT_ED25519_PRIVATE_KEY: ${JWT_ED25519_PRIVATE_KEY}
      JWT_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY}
      ADMIN_BFF_AUTH_ED25519_PUBLIC_KEY: ${JWT_ED25519_PUBLIC_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY}
      APP_ENV: ${APP_ENV:-production}
      CORS_ORIGINS: ${CORS_ORIGINS}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      # Long form, because `- auth` only waits for the container to exist. Each
      # gRPC client is created with grpc.NewClient, which does not connect, so a
      # dependency that is up but not yet serving makes every admin request fail
      # at call time instead of at boot.
      auth:
        condition: service_healthy
      user:
        condition: service_healthy
      payment:
        condition: service_healthy
      casino:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8091/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s

  # ================================================================
  # FRONTEND
  # ================================================================

  web:
    container_name: opus-web
    image: opus-casino/web:${IMAGE_TAG:-latest}
    build:
      # Repository root: the Dockerfile copies apps/web/* from this context.
      context: ../..
      dockerfile: infra/docker/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: wss://${APP_DOMAIN}/ws
        NEXT_PUBLIC_SENTRY_DSN: ${SENTRY_DSN_FRONTEND}
        NEXT_PUBLIC_APP_ENV: ${APP_ENV:-production}
    restart: unless-stopped
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:3000/api/health"]
      interval: 20s
      timeout: 5s
      retries: 10
      start_period: 30s
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  admin:
    container_name: opus-admin
    image: opus-casino/admin:${IMAGE_TAG:-latest}
    build:
      # Repository root: the admin app depends on libs/shared/typescript via a
      # file: link that lives outside apps/admin.
      context: ../..
      dockerfile: infra/docker/Dockerfile.admin
      args:
        # The admin SPA talks to the BFF through nginx at /admin-api/.
        VITE_API_URL: ${ADMIN_API_URL:-/admin-api}
        VITE_APP_ENV: ${APP_ENV:-production}
    restart: unless-stopped
    networks:
      - frontend
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:80/"]
      interval: 20s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ================================================================
  # NGINX (API Gateway + SSL termination + static files)
  # ================================================================

  nginx:
    image: nginx:1.25-alpine
    container_name: opus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_logs:/var/log/nginx
    networks:
      - frontend
      - backend
    depends_on:
      - web
      - admin
      - auth
      - payment
      - casino
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 5s
      retries: 3
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "10"

  # ================================================================
  # BACKUP CRON
  # ================================================================

  backup:
    image: postgres:16-alpine
    container_name: opus-backup
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-opus-casino-backups}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ../../tools/backup:/scripts:ro
      - backup_tmp:/tmp/backups
    networks:
      - backend
    entrypoint: ["/bin/sh", "/scripts/postgres-backup.sh", "--cron"]
    depends_on:
      postgres:
        condition: service_healthy

# ================================================================
# VOLUMES
# ================================================================
volumes:
  postgres_data:
    driver: local
  dragonfly_data:
    driver: local
  clickhouse_data:
    driver: local
  redpanda_data:
    driver: local
  minio_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
  backup_tmp:
    driver: local

# ================================================================
# NETWORKS
# ================================================================
networks:
  backend:
    driver: bridge
    internal: true
  frontend:
    driver: bridge
  monitoring:
    driver: bridge
    internal: true
