apiVersion: apps/v1
kind: Deployment
metadata:
  name: wallet-core
  namespace: opus-casino
  labels:
    app: wallet-core
    version: v1
spec:
  replicas: 3
  selector:
    matchLabels:
      app: wallet-core
  template:
    metadata:
      labels:
        app: wallet-core
        version: v1
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3003"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: opus-casino
      containers:
      - name: wallet-core
        image: opus-casino/wallet-core:latest
        imagePullPolicy: Always
        # The service is config-rs based: HTTP__ADDR defaults to 0.0.0.0:3003
        # and GRPC__ADDR to 0.0.0.0:50053 (see src/config.rs), so the previous
        # 8080/50051 pair pointed the probes and the Service at closed ports.
        ports:
        - name: http
          containerPort: 3003
          protocol: TCP
        - name: grpc
          containerPort: 50053
          protocol: TCP
        envFrom:
        - configMapRef:
            name: app-config
        - secretRef:
            name: app-secrets
        resources:
          requests:
            cpu: "500m"
            memory: "256Mi"
          limits:
            cpu: "2000m"
            memory: "512Mi"
        livenessProbe:
          httpGet:
            path: /health
            port: 3003
          initialDelaySeconds: 10
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /ready
            port: 3003
          initialDelaySeconds: 5
          periodSeconds: 5
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchExpressions:
                - key: app
                  operator: In
                  values:
                  - wallet-core
              topologyKey: kubernetes.io/hostname
---
apiVersion: v1
kind: Service
metadata:
  name: wallet-core
  namespace: opus-casino
  labels:
    app: wallet-core
spec:
  selector:
    app: wallet-core
  ports:
  - name: http
    port: 3003
    targetPort: 3003
  - name: grpc
    port: 50053
    targetPort: 50053
  type: ClusterIP
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: wallet-core-pdb
  namespace: opus-casino
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: wallet-core
